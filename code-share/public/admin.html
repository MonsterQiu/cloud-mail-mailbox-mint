<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>管理取码授权</title><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"></head><body><div class="page"><header class="topbar"><a class="brand" href="/"><img src="/icon.svg" alt=""><span>邮箱取码<span class="brand-note">SHARE MANAGEMENT</span></span></a><span class="top-note">管理您的分享入口</span></header><main class="admin-main"><h1>管理取码授权</h1><p class="hint">为已有邮箱创建独立入口，随时撤销分享。</p><section id="admin-login" class="admin-card"><form id="admin-login-form"><label for="admin-key">管理口令</label><input id="admin-key" type="password" required autocomplete="off"><button class="primary" type="submit">进入管理</button></form></section><div id="admin-content" hidden><section class="admin-card"><div class="grant-top"><h2>创建分享入口</h2><button id="admin-logout" type="button" class="text-button">退出管理</button></div><form id="create-form"><label for="email">已有邮箱地址</label><input id="email" type="email" required autocomplete="off" placeholder="输入需要分享的邮箱"><div class="admin-row"><div><label for="label">备注（选填）</label><input id="label" maxlength="60" placeholder="这份授权交给谁"></div><div><label for="days">有效期</label><select id="days"><option value="1">1 天</option><option value="7">7 天</option><option value="30" selected>30 天</option><option value="90">90 天</option></select></div></div><p class="hint">对方只能获取创建授权之后收到的新验证码。</p><button id="create-button" type="submit" class="primary">创建链接和口令</button></form><section id="created" hidden><h3>请保存并交给对方</h3><p class="hint">口令只在创建时显示。关闭后需要创建新授权才能获取新口令。</p><pre id="credentials" class="credential-block"></pre><button id="copy-share" type="button" class="secondary">复制链接和口令</button></section></section><section class="admin-card"><h2>已有授权</h2><div id="grants"></div><button id="reload-grants" type="button" class="secondary">刷新列表</button></section></div><p id="notice" class="notice" role="status" hidden></p></main><footer class="page-footer"><span>管理口令只供您本人使用</span><span>SHARE CONTROL</span></footer></div><script type="module" src="/admin.js"></script></body></html>
