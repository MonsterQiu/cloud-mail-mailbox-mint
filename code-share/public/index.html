<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>专属邮箱取码</title><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"></head>
<body><div class="page"><header class="topbar"><a class="brand" href="/" aria-label="专属邮箱取码"><img src="/icon.svg" alt=""><span>邮箱取码<span class="brand-note">PRIVATE INBOX</span></span></a><span class="top-note">一个邮箱 · 一个专属入口</span></header>
<main class="layout"><section class="intro"><p class="eyebrow">您的收件入口</p><h1>新验证码，<br>在这里等您。</h1><p class="description">打开入口，等待邮件，点击复制。<br>手机和电脑都可以使用。</p><div class="mail-stamp" aria-hidden="true"><svg viewBox="0 0 120 84" fill="none"><rect x="1" y="1" width="118" height="82" rx="9" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/><path d="M28 25h64v37H28zM28 25l32 23 32-23" stroke="currentColor" stroke-width="2"/><path d="M36 62l15-19m33 19L69 43" stroke="currentColor" stroke-width="2"/></svg><span>只为授权邮箱取码</span></div></section>
<section class="ticket" aria-label="专属邮箱收件码"><div class="ticket-head"><span class="ticket-kicker">MAIL / CODE</span><span id="connection" class="state-tag">待验证</span></div>
<div class="ticket-body"><section id="login-panel"><h2 id="panel-title">输入访问口令</h2><p class="hint">使用分享人提供的专属链接和口令。</p><form id="login-form"><label for="passcode">访问口令</label><input id="passcode" name="passcode" type="password" required autocomplete="off" maxlength="128" placeholder="粘贴您的访问口令"><button id="login-button" class="primary" type="submit">打开我的收件码 <span aria-hidden="true">→</span></button></form><p id="link-error" class="hint" hidden>这个页面需要专属链接。请向分享人获取完整链接后打开。</p></section>
<section id="inbox-panel" hidden><div class="inbox-heading"><div><h2>当前收件邮箱</h2><p id="mailbox" class="mailbox"></p></div><button id="logout" class="text-button" type="button">退出</button></div><p id="expiry" class="hint"></p><div class="actions"><button id="refresh" type="button" class="primary">刷新验证码</button><button id="wait" type="button" class="secondary">等待新验证码</button></div><p id="watch-status" class="watch-status" role="status">点击刷新查看新邮件。</p><div id="messages" class="messages"><div class="empty"><span class="empty-envelope" aria-hidden="true">✉</span><h3>等待一封新邮件</h3><p>这里只显示授权后收到的新验证码。</p></div></div></section>
<p id="notice" class="notice" role="status" aria-live="polite" hidden></p></div><div class="ticket-foot"><span class="dot" aria-hidden="true"></span>新邮件取码 · 北京时间 · 点击复制</div></section></main>
<footer class="page-footer"><span>仅用于您被授权访问的邮箱</span><span>CODE DELIVERY</span></footer></div><script type="module" src="/app.js"></script></body></html>
