<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>专属邮箱取码</title><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"></head>
<body><div class="page"><header class="topbar"><a class="brand" href="/" aria-label="邮箱取码"><img src="/icon.svg" alt=""><span>邮箱取码</span></a><span id="connection" class="state-tag">待验证</span></header>
<main class="layout"><section class="ticket" aria-label="邮箱收件码"><div class="ticket-body">
<section id="login-panel"><h1 id="panel-title">输入访问口令</h1><form id="login-form"><label for="passcode">访问口令</label><input id="passcode" name="passcode" type="password" required autocomplete="off" maxlength="128" placeholder="粘贴访问口令"><button id="login-button" class="primary" type="submit">进入</button></form><p id="link-error" class="hint" hidden>请使用分享人提供的完整链接。</p></section>
<section id="inbox-panel" hidden><div class="inbox-heading"><div><h1>收件邮箱</h1><p id="mailbox" class="mailbox"></p></div><button id="logout" class="text-button" type="button">退出</button></div><p id="expiry" class="hint"></p><div class="actions"><button id="refresh" type="button" class="primary">刷新验证码</button><button id="wait" type="button" class="secondary">等待新验证码</button></div><p id="watch-status" class="watch-status" role="status" hidden></p><div id="messages" class="messages"><div class="empty"><h2>暂无新验证码</h2></div></div></section>
<p id="notice" class="notice" role="status" aria-live="polite" hidden></p></div></section></main>
</div><script type="module" src="/app.js"></script></body></html>
